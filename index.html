<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoWater Lab | Peking University - Dr. Peirong Lin</title>
    <meta name="description" content="Official website of the GeoWater Lab at Peking University, led by Dr. Peirong Lin. We focus on global hydrology, remote sensing, and data-intensive water science.">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="app-shell">
    <header class="primary-nav">
        <div class="nav-inner">
            <a href="home.html" target="content" class="brand">
                <span class="brand-label">GeoWater Lab</span>
                <span class="brand-subtitle">Peking University</span>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="home.html" target="content" class="active" onclick="setActive(event)">Home</a></li>
                    <li><a href="research.html" target="content" onclick="setActive(event)">Research</a></li>
                    <li><a href="publications.html" target="content" onclick="setActive(event)">Publications</a></li>
                    <li><a href="team.html" target="content" onclick="setActive(event)">Team</a></li>
                    <li><a href="contact.html" target="content" onclick="setActive(event)">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="shell-main" style="margin-top: 80px;">
        <iframe title="Page content" name="content" class="content-frame" src="home.html"></iframe>
    </main>

    <script>
        function setActive(event) {
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peirong Lin | GeoWater Lab</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="app-shell">
    <header class="primary-nav">
        <div class="nav-inner">
            <div class="brand">GEOWATER LAB @ PKU</div>
            <nav>
                <ul>
                    <li><a href="home.html" target="content" class="active" onclick="setActive(event)">Home</a></li>
                    <li><a href="research.html" target="content" onclick="setActive(event)">Research</a></li>
                    <li><a href="publications.html" target="content" onclick="setActive(event)">Publications</a></li>
                    <li><a href="team.html" target="content" onclick="setActive(event)">Team</a></li>
                    <li><a href="contact.html" target="content" onclick="setActive(event)">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="shell-main">
        <iframe title="Page content" name="content" class="content-frame" src="home.html"></iframe>
    </main>

    <script>
        function setActive(event) {
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>

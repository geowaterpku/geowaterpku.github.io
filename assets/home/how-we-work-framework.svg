<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Four tools for spatially explicit hydrology</title>
  <desc id="desc">Earth observation, geospatial information, process-based and data-driven modeling, and spatially informed parameterization converge on spatially explicit hydrology.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9fb"/>
      <stop offset="1" stop-color="#e4f0f4"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073653"/>
      <stop offset="1" stop-color="#0b668f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#65b6d7"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#062a47" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1000" height="760" rx="30" fill="url(#bg)"/>
  <path d="M310 191C390 235 424 277 462 327M690 191C610 235 576 277 538 327M310 569C390 525 424 483 462 433M690 569C610 525 576 483 538 433" fill="none" stroke="#65b6d7" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="55" y="74" width="310" height="196" rx="22" fill="#fff" stroke="#c9dfe8" stroke-width="2"/>
    <rect x="635" y="74" width="310" height="196" rx="22" fill="#fff" stroke="#c9dfe8" stroke-width="2"/>
    <rect x="55" y="490" width="310" height="196" rx="22" fill="#fff" stroke="#c9dfe8" stroke-width="2"/>
    <rect x="635" y="490" width="310" height="196" rx="22" fill="#fff" stroke="#c9dfe8" stroke-width="2"/>
    <circle cx="500" cy="380" r="142" fill="url(#core)"/>
  </g>

  <g transform="translate(88 104)" fill="none" stroke="#0b7fae" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="51" y="22" width="54" height="34" rx="5"/>
    <path d="M78 9V22M78 56V77M31 39H51M105 39H125"/>
    <path d="M11 22H40V58H11zM116 22H145V58H116z"/>
    <path d="M65 77h26"/>
  </g>
  <text x="88" y="210" fill="#0a3553" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="1.2">EARTH OBSERVATION</text>
  <text x="88" y="240" fill="#58717f" font-family="Arial, sans-serif" font-size="18">Satellites · Remote sensing</text>

  <g transform="translate(670 103)" fill="none" stroke="#0b7fae" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 78C43 60 39 33 65 21c25-12 31 25 57 11"/>
    <path d="M64 48C49 43 43 31 36 18M82 44c20 1 31-8 48-19M53 65c-14 7-27 9-42 6"/>
    <circle cx="65" cy="21" r="5" fill="#0b7fae"/>
    <circle cx="53" cy="65" r="5" fill="#0b7fae"/>
  </g>
  <text x="668" y="210" fill="#0a3553" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1">GEOSPATIAL INFORMATION</text>
  <text x="668" y="240" fill="#58717f" font-family="Arial, sans-serif" font-size="18">Networks · Geometry · Floodplains</text>

  <g transform="translate(88 520)" fill="none" stroke="#0b7fae" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="22" cy="54" r="11"/><circle cx="76" cy="17" r="11"/><circle cx="130" cy="52" r="11"/><circle cx="77" cy="88" r="11"/>
    <path d="M31 48L67 24M86 23l35 23M120 59L87 82M67 82L31 61M33 54h86"/>
  </g>
  <text x="88" y="626" fill="#0a3553" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing=".8">PROCESS + DATA MODELS</text>
  <text x="88" y="656" fill="#58717f" font-family="Arial, sans-serif" font-size="18">Hydrology · Hydraulics · AI</text>

  <g transform="translate(670 520)" fill="none" stroke="#0b7fae" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 24h132M15 57h132M15 90h132"/>
    <circle cx="52" cy="24" r="11" fill="#fff"/><circle cx="111" cy="57" r="11" fill="#fff"/><circle cx="73" cy="90" r="11" fill="#fff"/>
  </g>
  <text x="668" y="626" fill="#0a3553" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing=".7">SPATIAL PARAMETERIZATION</text>
  <text x="668" y="656" fill="#58717f" font-family="Arial, sans-serif" font-size="18">Location-aware · Adaptive</text>

  <g text-anchor="middle" font-family="Arial, sans-serif">
    <text x="500" y="350" fill="#9ddcf2" font-size="17" font-weight="700" letter-spacing="3">SPATIALLY EXPLICIT</text>
    <text x="500" y="392" fill="#fff" font-size="35" font-weight="700">HYDROLOGY</text>
    <path d="M430 419H570" stroke="#8ed3ee" stroke-width="2"/>
    <text x="500" y="452" fill="#d7edf6" font-size="17">observe · represent · model · adapt</text>
  </g>
</svg>
# Build shared components and deploy only the generated public site.
name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Update Contact Visitor Map", "Update Google Scholar metrics", "Update Paper Radar"]
    types: [completed]
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site-tools/requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r site-tools/requirements.txt
      - name: Build static site
        run: GITHUB_SHA="$(git rev-parse HEAD)" python site-tools/build.py
      - name: Validate before publishing
        run: python site-tools/validate.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public deployment
        run: python site-tools/verify-live.py
      - name: Upload release verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-release-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

name: Replace Home 01 Background

on:
  push:
    paths:
      - '.bg-upload-trigger'

permissions:
  contents: write

jobs:
  replace-background:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild optimized image and update Home 01
        shell: bash
        run: |
          set -euo pipefail
          cat .bg-upload/chunk_*.txt | tr -d '\n' | base64 -d > assets/research/background1.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('home.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/research/background1.png'
          new = 'assets/research/background1.webp'
          if old not in s and new not in s:
              raise SystemExit('Home 01 background reference not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm -rf .bg-upload .bg-upload-trigger

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Replace Home 01 background image"
          git push

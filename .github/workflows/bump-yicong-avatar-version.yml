name: Bump Yicong avatar version

on:
  push:
    branches:
      - fix-yicong-avatar-binary
    paths:
      - '.github/workflows/bump-yicong-avatar-version.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-yicong-avatar-binary
      - name: Bump Yicong avatar cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('people.html')
          text = p.read_text(encoding='utf-8')
          old = 'assets/team/yicong_liu.webp?v=1'
          new = 'assets/team/yicong_liu.webp?v=2'
          if old not in text:
              raise SystemExit('Expected Yicong avatar reference not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cache-bust update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- people.html
          git commit -m 'Bump Yicong Liu avatar cache key'
          git push origin HEAD:fix-yicong-avatar-binary

name: Update Paper Radar

on:
  schedule:
    # 08:20 Beijing time is the primary run. 12:20 and 16:20 are recovery
    # wake-ups; the freshness guard prevents duplicate API calls.
    - cron: '20 0,4,8 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - paper-radar.html
      - assets/paper-radar.js
      - assets/paper-radar.css
      - scripts/update_paper_radar.py
      - scripts/backfill_paper_radar.py
      - scripts/supplement_paper_radar_day.py
      - scripts/enrich_paper_radar_summaries.py
      - .github/workflows/update-paper-radar.yml

permissions:
  contents: write

concurrency:
  group: paper-radar
  cancel-in-progress: true

jobs:
  update-paper-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether today's Paper Radar refresh is already complete
        id: refresh_check
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          # Preserve force-refresh behavior for manual and path-triggered runs.
          if os.environ.get('GITHUB_EVENT_NAME') != 'schedule':
              should_run = True
              reason = f"{os.environ.get('GITHUB_EVENT_NAME', 'unknown')} event forces a refresh"
          else:
              now = datetime.now(ZoneInfo('Asia/Shanghai'))
              expected_target = (now.date() - timedelta(days=1)).isoformat()
              output = Path('assets/data/paper-radar.json')

              target_date = None
              target_status = None
              if output.exists():
                  try:
                      data = json.loads(output.read_text(encoding='utf-8'))
                      target_date = data.get('targetDate')
                      target_status = (
                          (data.get('crawlHistory') or {})
                          .get(expected_target, {})
                          .get('status')
                      )
                  except Exception as exc:
                      print(f'Could not parse existing Paper Radar freshness: {exc}')

              fresh = target_date == expected_target and target_status == 'success'
              should_run = not fresh
              if should_run:
                  reason = (
                      f'expected target {expected_target} is not complete '
                      f'(targetDate={target_date!r}, status={target_status!r})'
                  )
              else:
                  reason = f'expected target {expected_target} is already complete'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"should_run={'true' if should_run else 'false'}\n")

          print(f"Paper Radar refresh decision: should_run={should_run}; {reason}")
          PY

      - name: Set up Python
        if: steps.refresh_check.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.refresh_check.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Generate Paper Radar data
        if: steps.refresh_check.outputs.should_run == 'true'
        env:
          PAPER_RADAR_SERPAPI_KEY: ${{ secrets.PAPER_RADAR_SERPAPI_KEY }}
        run: |
          python scripts/backfill_paper_radar.py
          python scripts/update_paper_radar.py
          python scripts/supplement_paper_radar_day.py

      - name: Generate Chinese research guides
        if: steps.refresh_check.outputs.should_run == 'true'
        env:
          PAPER_RADAR_LLM_API_KEY: ${{ secrets.PAPER_RADAR_LLM_API_KEY }}
          PAPER_RADAR_LLM_BASE_URL: ${{ secrets.PAPER_RADAR_LLM_BASE_URL || vars.PAPER_RADAR_LLM_BASE_URL }}
          PAPER_RADAR_LLM_MODEL: ${{ secrets.PAPER_RADAR_LLM_MODEL || vars.PAPER_RADAR_LLM_MODEL }}
        run: python scripts/enrich_paper_radar_summaries.py

      - name: Commit and push Paper Radar data
        if: steps.refresh_check.outputs.should_run == 'true'
        env:
          PAPER_RADAR_SERPAPI_KEY: ${{ secrets.PAPER_RADAR_SERPAPI_KEY }}
          PAPER_RADAR_LLM_API_KEY: ${{ secrets.PAPER_RADAR_LLM_API_KEY }}
          PAPER_RADAR_LLM_BASE_URL: ${{ secrets.PAPER_RADAR_LLM_BASE_URL || vars.PAPER_RADAR_LLM_BASE_URL }}
          PAPER_RADAR_LLM_MODEL: ${{ secrets.PAPER_RADAR_LLM_MODEL || vars.PAPER_RADAR_LLM_MODEL }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add -- assets/data/paper-radar.json

            if git diff --cached --quiet; then
              echo 'Paper Radar data is unchanged.'
              exit 0
            fi

            git commit -m 'Update Paper Radar'

            if git push origin HEAD:main; then
              echo 'Paper Radar data pushed successfully.'
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo '::error::Could not push Paper Radar data after 3 attempts.'
              exit 1
            fi

            echo "main advanced during attempt ${attempt}; regenerating from the latest main before retrying."
            git fetch origin main
            git reset --hard origin/main

            python scripts/backfill_paper_radar.py
            python scripts/update_paper_radar.py
            python scripts/supplement_paper_radar_day.py
            python scripts/enrich_paper_radar_summaries.py
          done

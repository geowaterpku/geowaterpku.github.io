name: Update Paper Radar

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - paper-radar.html
      - assets/paper-radar.js
      - scripts/update_paper_radar.py
      - scripts/backfill_paper_radar.py
      - .github/workflows/update-paper-radar.yml

permissions:
  contents: write

concurrency:
  group: paper-radar
  cancel-in-progress: true

jobs:
  update-paper-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Backfill missing 30-day history
        run: python scripts/backfill_paper_radar.py

      - name: Commit backfilled history
        run: |
          git add -- assets/data/paper-radar.json
          if git diff --cached --quiet; then
            echo 'Paper Radar history is already complete.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Backfill Paper Radar history'
            git pull --rebase
            git push
          fi

      - name: Refresh Google Scholar paper radar
        env:
          PAPER_RADAR_SERPAPI_KEY: ${{ secrets.PAPER_RADAR_SERPAPI_KEY }}
        run: python scripts/update_paper_radar.py

      - name: Commit refreshed paper data
        run: |
          git add -- assets/data/paper-radar.json
          if git diff --cached --quiet; then
            echo 'Paper Radar data is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Paper Radar'
          git pull --rebase
          git push

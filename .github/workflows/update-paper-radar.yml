name: Update Paper Radar

on:
  schedule:
    # 08:20 Beijing time is the primary publication refresh. 12:20 and 16:20
    # also recover missing or outdated AI guides without repeating Scholar/Crossref work.
    - cron: '20 0,4,8 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - paper-radar.html
      - assets/paper-radar.js
      - assets/paper-radar.css
      - scripts/update_paper_radar.py
      - scripts/backfill_paper_radar.py
      - scripts/supplement_paper_radar_day.py
      - scripts/enrich_paper_radar_summaries.py
      - .github/workflows/update-paper-radar.yml

permissions:
  contents: write

concurrency:
  group: paper-radar
  cancel-in-progress: true

jobs:
  update-paper-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Decide publication refresh and summary recovery
        id: refresh_check
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          SUMMARY_PROMPT_VERSION = 3
          event_name = os.environ.get('GITHUB_EVENT_NAME', 'unknown')
          output = Path('assets/data/paper-radar.json')
          data = {}
          if output.exists():
              try:
                  parsed = json.loads(output.read_text(encoding='utf-8'))
                  if isinstance(parsed, dict):
                      data = parsed
              except Exception as exc:
                  print(f'Could not parse existing Paper Radar data: {exc}')

          papers = data.get('papers') or []

          def guide_needs_refresh(paper):
              if not isinstance(paper, dict):
                  return False
              if not str(paper.get('summaryZh') or '').strip():
                  return True
              try:
                  version = int(paper.get('summaryPromptVersion') or 0)
              except (TypeError, ValueError):
                  version = 0
              return version < SUMMARY_PROMPT_VERSION

          pending_guides = sum(1 for paper in papers if guide_needs_refresh(paper))

          if event_name != 'schedule':
              should_refresh = True
              refresh_reason = f'{event_name} event forces a publication refresh'
          else:
              now = datetime.now(ZoneInfo('Asia/Shanghai'))
              expected_target = (now.date() - timedelta(days=1)).isoformat()
              target_date = data.get('targetDate')
              target_status = (
                  (data.get('crawlHistory') or {})
                  .get(expected_target, {})
                  .get('status')
              )
              fresh = target_date == expected_target and target_status == 'success'
              should_refresh = not fresh
              refresh_reason = (
                  f'expected target {expected_target} is not complete '
                  f'(targetDate={target_date!r}, status={target_status!r})'
                  if should_refresh
                  else f'expected target {expected_target} is already complete'
              )

          # If publication data refreshes, run enrichment afterward because new
          # papers may be added. Otherwise recovery runs only retry missing or
          # outdated guides, without repeating Scholar/Crossref work.
          should_enrich = should_refresh or pending_guides > 0

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"should_refresh={'true' if should_refresh else 'false'}\n")
              handle.write(f"should_enrich={'true' if should_enrich else 'false'}\n")
              handle.write(f"pending_guides={pending_guides}\n")

          print(
              'Paper Radar decision: '
              f'should_refresh={should_refresh}; should_enrich={should_enrich}; '
              f'pending_guides={pending_guides}; prompt_version={SUMMARY_PROMPT_VERSION}; '
              f'{refresh_reason}'
          )
          PY

      - name: Set up Python
        if: steps.refresh_check.outputs.should_refresh == 'true' || steps.refresh_check.outputs.should_enrich == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.refresh_check.outputs.should_refresh == 'true' || steps.refresh_check.outputs.should_enrich == 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Generate Paper Radar data
        if: steps.refresh_check.outputs.should_refresh == 'true'
        env:
          PAPER_RADAR_SERPAPI_KEY: ${{ secrets.PAPER_RADAR_SERPAPI_KEY }}
        run: |
          python scripts/backfill_paper_radar.py
          python scripts/update_paper_radar.py
          python scripts/supplement_paper_radar_day.py

      - name: Generate Chinese research guides
        if: steps.refresh_check.outputs.should_enrich == 'true'
        env:
          PAPER_RADAR_LLM_API_KEY: ${{ secrets.PAPER_RADAR_LLM_API_KEY }}
          PAPER_RADAR_LLM_BASE_URL: ${{ secrets.PAPER_RADAR_LLM_BASE_URL || vars.PAPER_RADAR_LLM_BASE_URL }}
          PAPER_RADAR_LLM_MODEL: ${{ secrets.PAPER_RADAR_LLM_MODEL || vars.PAPER_RADAR_LLM_MODEL }}
        run: python scripts/enrich_paper_radar_summaries.py

      - name: Commit and push Paper Radar data
        if: steps.refresh_check.outputs.should_refresh == 'true' || steps.refresh_check.outputs.should_enrich == 'true'
        env:
          PAPER_RADAR_SERPAPI_KEY: ${{ secrets.PAPER_RADAR_SERPAPI_KEY }}
          PAPER_RADAR_LLM_API_KEY: ${{ secrets.PAPER_RADAR_LLM_API_KEY }}
          PAPER_RADAR_LLM_BASE_URL: ${{ secrets.PAPER_RADAR_LLM_BASE_URL || vars.PAPER_RADAR_LLM_BASE_URL }}
          PAPER_RADAR_LLM_MODEL: ${{ secrets.PAPER_RADAR_LLM_MODEL || vars.PAPER_RADAR_LLM_MODEL }}
          SHOULD_REFRESH: ${{ steps.refresh_check.outputs.should_refresh }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add -- assets/data/paper-radar.json

            if git diff --cached --quiet; then
              echo 'Paper Radar data is unchanged.'
              exit 0
            fi

            git commit -m 'Update Paper Radar'

            if git push origin HEAD:main; then
              echo 'Paper Radar data pushed successfully.'
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo '::error::Could not push Paper Radar data after 3 attempts.'
              exit 1
            fi

            echo "main advanced during attempt ${attempt}; regenerating from the latest main before retrying."
            git fetch origin main
            git reset --hard origin/main

            if [ "$SHOULD_REFRESH" = "true" ]; then
              python scripts/backfill_paper_radar.py
              python scripts/update_paper_radar.py
              python scripts/supplement_paper_radar_day.py
            fi
            python scripts/enrich_paper_radar_summaries.py
          done

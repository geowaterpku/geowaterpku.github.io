name: Update Paper Radar

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - paper-radar.html
      - assets/paper-radar.js
      - scripts/update_paper_radar.py
      - scripts/backfill_paper_radar.py
      - scripts/supplement_paper_radar_day.py
      - .github/workflows/update-paper-radar.yml

permissions:
  contents: write

concurrency:
  group: paper-radar
  cancel-in-progress: true

jobs:
  update-paper-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Generate Paper Radar data
        env:
          PAPER_RADAR_SERPAPI_KEY: ${{ secrets.PAPER_RADAR_SERPAPI_KEY }}
        run: |
          python scripts/backfill_paper_radar.py
          python scripts/update_paper_radar.py
          python scripts/supplement_paper_radar_day.py

      - name: Commit and push Paper Radar data
        env:
          PAPER_RADAR_SERPAPI_KEY: ${{ secrets.PAPER_RADAR_SERPAPI_KEY }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add -- assets/data/paper-radar.json

            if git diff --cached --quiet; then
              echo 'Paper Radar data is unchanged.'
              exit 0
            fi

            git commit -m 'Update Paper Radar'

            if git push origin HEAD:main; then
              echo 'Paper Radar data pushed successfully.'
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo '::error::Could not push Paper Radar data after 3 attempts.'
              exit 1
            fi

            echo "main advanced during attempt ${attempt}; regenerating from the latest main before retrying."
            git fetch origin main
            git reset --hard origin/main

            python scripts/backfill_paper_radar.py
            python scripts/update_paper_radar.py
            python scripts/supplement_paper_radar_day.py
          done

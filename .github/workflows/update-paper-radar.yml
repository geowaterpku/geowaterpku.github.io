name: Update Paper Radar

on:
  schedule:
    # Primary refreshes: 08:20 / 12:20 / 16:20 Beijing time.
    - cron: '20 0 * * *'
    - cron: '20 4 * * *'
    - cron: '20 8 * * *'
    # Independent fallback opportunities. They are intentionally offset from
    # common cron minutes; if the data is already fresh these runs exit quickly
    # without calling Scholar/Crossref/SerpAPI or the LLM.
    - cron: '37 2 * * *'
    - cron: '37 6 * * *'
    - cron: '37 10 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force publication refresh even when yesterday is already complete'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - paper-radar.html
      - assets/paper-radar.js
      - assets/paper-radar.css
      - scripts/update_paper_radar.py
      - scripts/backfill_paper_radar.py
      - scripts/supplement_paper_radar_day.py
      - scripts/enrich_paper_radar_summaries.py
      - scripts/enrich_paper_radar_summaries_checkpointed.py
      - .github/workflows/update-paper-radar.yml

permissions:
  contents: write

concurrency:
  group: paper-radar
  # Do not cancel an in-flight publication/enrichment run when a fallback cron
  # fires. A queued no-op is safer than interrupting a valid update halfway.
  cancel-in-progress: false

jobs:
  update-paper-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Decide publication refresh and summary recovery
        id: refresh_check
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          SUMMARY_PROMPT_VERSION = 3
          force_refresh = (os.environ.get('FORCE_REFRESH') or '').strip().lower() == 'true'
          output = Path('assets/data/paper-radar.json')
          data = {}
          if output.exists():
              try:
                  parsed = json.loads(output.read_text(encoding='utf-8'))
                  if isinstance(parsed, dict):
                      data = parsed
              except Exception as exc:
                  print(f'Could not parse existing Paper Radar data: {exc}')

          papers = data.get('papers') or []

          def guide_needs_refresh(paper):
              if not isinstance(paper, dict):
                  return False
              if not str(paper.get('summaryZh') or '').strip():
                  return True
              try:
                  version = int(paper.get('summaryPromptVersion') or 0)
              except (TypeError, ValueError):
                  version = 0
              return version < SUMMARY_PROMPT_VERSION

          pending_guides = sum(1 for paper in papers if guide_needs_refresh(paper))
          now = datetime.now(ZoneInfo('Asia/Shanghai'))
          expected_target = (now.date() - timedelta(days=1)).isoformat()
          target_date = data.get('targetDate')
          target_status = (
              (data.get('crawlHistory') or {})
              .get(expected_target, {})
              .get('status')
          )
          fresh = target_date == expected_target and target_status == 'success'
          should_refresh = force_refresh or not fresh

          if force_refresh:
              refresh_reason = 'manual force_refresh requested'
          elif should_refresh:
              refresh_reason = (
                  f'expected target {expected_target} is not complete '
                  f'(targetDate={target_date!r}, status={target_status!r})'
              )
          else:
              refresh_reason = f'expected target {expected_target} is already complete'

          # If publication data refreshes, enrichment runs afterward because new
          # papers may be added. Otherwise only missing/outdated guides are retried.
          should_enrich = should_refresh or pending_guides > 0

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"should_refresh={'true' if should_refresh else 'false'}\n")
              handle.write(f"should_enrich={'true' if should_enrich else 'false'}\n")
              handle.write(f"pending_guides={pending_guides}\n")
              handle.write(f"expected_target={expected_target}\n")

          print(
              'Paper Radar decision: '
              f'should_refresh={should_refresh}; should_enrich={should_enrich}; '
              f'pending_guides={pending_guides}; prompt_version={SUMMARY_PROMPT_VERSION}; '
              f'{refresh_reason}'
          )
          PY

      - name: Set up Python
        if: steps.refresh_check.outputs.should_refresh == 'true' || steps.refresh_check.outputs.should_enrich == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.refresh_check.outputs.should_refresh == 'true' || steps.refresh_check.outputs.should_enrich == 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      # Publication refresh is deliberately independent of LLM enrichment. Even
      # if the LLM provider is down, yesterday's paper list can still go live.
      - name: Generate Paper Radar publication data
        if: steps.refresh_check.outputs.should_refresh == 'true'
        env:
          PAPER_RADAR_SERPAPI_KEY: ${{ secrets.PAPER_RADAR_SERPAPI_KEY }}
        run: |
          set -euo pipefail
          python scripts/backfill_paper_radar.py
          python scripts/update_paper_radar.py
          python scripts/supplement_paper_radar_day.py

      - name: Validate publication freshness
        if: steps.refresh_check.outputs.should_refresh == 'true'
        env:
          EXPECTED_TARGET: ${{ steps.refresh_check.outputs.expected_target }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path('assets/data/paper-radar.json')
          expected = os.environ['EXPECTED_TARGET']
          if not path.exists():
              print('::error::Paper Radar output file was not generated.')
              sys.exit(1)

          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'::error::Paper Radar output is invalid JSON: {exc}')
              sys.exit(1)

          target_date = data.get('targetDate')
          status = ((data.get('crawlHistory') or {}).get(expected, {}) or {}).get('status')
          if target_date != expected or status != 'success':
              print(
                  '::error::Publication refresh did not complete the expected target: '
                  f'expected={expected!r}, targetDate={target_date!r}, status={status!r}'
              )
              sys.exit(1)

          papers = data.get('papers') or []
          print(
              f'Publication freshness validated: targetDate={target_date}; '
              f'crawlHistory status={status}; total papers={len(papers)}.'
          )
          PY

      - name: Commit publication data before LLM enrichment
        if: steps.refresh_check.outputs.should_refresh == 'true'
        env:
          PAPER_RADAR_SERPAPI_KEY: ${{ secrets.PAPER_RADAR_SERPAPI_KEY }}
          EXPECTED_TARGET: ${{ steps.refresh_check.outputs.expected_target }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          validate_publication() {
            python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path('assets/data/paper-radar.json')
          expected = os.environ['EXPECTED_TARGET']
          data = json.loads(path.read_text(encoding='utf-8'))
          target_date = data.get('targetDate')
          status = ((data.get('crawlHistory') or {}).get(expected, {}) or {}).get('status')
          if target_date != expected or status != 'success':
              print(
                  '::error::Regenerated publication data is still stale: '
                  f'expected={expected!r}, targetDate={target_date!r}, status={status!r}'
              )
              sys.exit(1)
          PY
          }

          for attempt in 1 2 3; do
            git add -- assets/data/paper-radar.json

            if git diff --cached --quiet; then
              echo 'Publication data is unchanged.'
              exit 0
            fi

            git commit -m 'Update Paper Radar publications'

            if git push origin HEAD:main; then
              echo 'Publication data pushed successfully before LLM enrichment.'
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo '::error::Could not push publication data after 3 attempts.'
              exit 1
            fi

            echo "main advanced during publication push attempt ${attempt}; regenerating from latest main."
            git fetch origin main
            git reset --hard origin/main
            python scripts/backfill_paper_radar.py
            python scripts/update_paper_radar.py
            python scripts/supplement_paper_radar_day.py
            validate_publication
          done

      - name: Check LLM API
        if: steps.refresh_check.outputs.should_enrich == 'true'
        env:
          PAPER_RADAR_LLM_API_KEY: ${{ secrets.PAPER_RADAR_LLM_API_KEY }}
          PAPER_RADAR_LLM_BASE_URL: ${{ secrets.PAPER_RADAR_LLM_BASE_URL || vars.PAPER_RADAR_LLM_BASE_URL }}
          PAPER_RADAR_LLM_MODEL: ${{ secrets.PAPER_RADAR_LLM_MODEL || vars.PAPER_RADAR_LLM_MODEL }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time

          import requests

          api_key = (os.environ.get('PAPER_RADAR_LLM_API_KEY') or '').strip()
          base_url = (os.environ.get('PAPER_RADAR_LLM_BASE_URL') or '').strip().rstrip('/')
          model = (os.environ.get('PAPER_RADAR_LLM_MODEL') or '').strip()

          missing = []
          if not api_key:
              missing.append('PAPER_RADAR_LLM_API_KEY')
          if not base_url:
              missing.append('PAPER_RADAR_LLM_BASE_URL')
          if not model:
              missing.append('PAPER_RADAR_LLM_MODEL')
          if missing:
              print(f"::error::LLM preflight failed: missing configuration: {', '.join(missing)}")
              sys.exit(1)

          url = base_url if base_url.endswith('/chat/completions') else f'{base_url}/chat/completions'
          headers = {
              'Authorization': f'Bearer {api_key}',
              'Content-Type': 'application/json',
              'Accept': 'application/json',
          }
          payload = {
              'model': model,
              'messages': [
                  {'role': 'system', 'content': 'You are an API connectivity checker.'},
                  {'role': 'user', 'content': 'Reply with exactly OK.'},
              ],
              'temperature': 0,
              'thinking': {'type': 'disabled'},
              'max_tokens': 16,
          }
          retryable = {408, 409, 425, 429, 500, 502, 503, 504}
          last_error = None

          def safe_body(response):
              text = (response.text or '')[:800]
              return text.replace(api_key, '***')

          def extract_content(response):
              data = response.json()
              choices = data.get('choices') or []
              if not choices:
                  raise RuntimeError('response has no choices')
              message = choices[0].get('message') or {}
              content = message.get('content')
              if isinstance(content, list):
                  parts = []
                  for part in content:
                      if isinstance(part, dict) and part.get('type') in {'text', 'output_text'}:
                          parts.append(str(part.get('text') or ''))
                  content = ''.join(parts)
              if not str(content or '').strip():
                  reasoning = str(message.get('reasoning_content') or '').strip()
                  if reasoning:
                      raise RuntimeError(
                          'response content is empty while reasoning_content is non-empty; '
                          'thinking may still be enabled or the output budget is exhausted'
                      )
                  raise RuntimeError('response content is empty')
              return str(content).strip()

          def post_with_compatibility(request_payload):
              response = requests.post(url, headers=headers, json=request_payload, timeout=20)
              body = safe_body(response)

              if response.status_code == 400 and 'max_tokens' in body:
                  request_payload = dict(request_payload)
                  request_payload['max_completion_tokens'] = request_payload.pop('max_tokens', 16)
                  response = requests.post(url, headers=headers, json=request_payload, timeout=20)
                  body = safe_body(response)

              if response.status_code == 400 and 'thinking' in body.lower():
                  request_payload = dict(request_payload)
                  request_payload.pop('thinking', None)
                  response = requests.post(url, headers=headers, json=request_payload, timeout=20)

              return response

          for attempt in range(1, 4):
              try:
                  response = post_with_compatibility(dict(payload))

                  if not response.ok:
                      body = safe_body(response)
                      if response.status_code in retryable:
                          raise RuntimeError(f'HTTP {response.status_code}: {body}')
                      print(f'::error::LLM preflight failed: HTTP {response.status_code}: {body}')
                      sys.exit(1)

                  content = extract_content(response)
                  print('LLM preflight succeeded: API key, base URL, model, and chat-completions response are valid.')
                  print(f'LLM preflight returned non-empty content ({len(content)} characters).')
                  sys.exit(0)
              except (requests.RequestException, ValueError, RuntimeError, json.JSONDecodeError) as exc:
                  last_error = exc
                  if attempt < 3:
                      print(f'LLM preflight attempt {attempt}/3 failed; retrying: {exc}')
                      time.sleep(2 * attempt)

          print(f'::error::LLM preflight failed after 3 attempts: {last_error}')
          sys.exit(1)
          PY

      - name: Generate Chinese research guides
        if: steps.refresh_check.outputs.should_enrich == 'true'
        env:
          PAPER_RADAR_LLM_API_KEY: ${{ secrets.PAPER_RADAR_LLM_API_KEY }}
          PAPER_RADAR_LLM_BASE_URL: ${{ secrets.PAPER_RADAR_LLM_BASE_URL || vars.PAPER_RADAR_LLM_BASE_URL }}
          PAPER_RADAR_LLM_MODEL: ${{ secrets.PAPER_RADAR_LLM_MODEL || vars.PAPER_RADAR_LLM_MODEL }}
          PAPER_RADAR_CHECKPOINT_EVERY: '5'
        run: python -u scripts/enrich_paper_radar_summaries_checkpointed.py

      - name: Commit enriched research guides
        if: steps.refresh_check.outputs.should_enrich == 'true'
        env:
          PAPER_RADAR_LLM_API_KEY: ${{ secrets.PAPER_RADAR_LLM_API_KEY }}
          PAPER_RADAR_LLM_BASE_URL: ${{ secrets.PAPER_RADAR_LLM_BASE_URL || vars.PAPER_RADAR_LLM_BASE_URL }}
          PAPER_RADAR_LLM_MODEL: ${{ secrets.PAPER_RADAR_LLM_MODEL || vars.PAPER_RADAR_LLM_MODEL }}
          PAPER_RADAR_CHECKPOINT_EVERY: '5'
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add -- assets/data/paper-radar.json

            if git diff --cached --quiet; then
              echo 'Research guides are unchanged.'
              exit 0
            fi

            git commit -m 'Update Paper Radar research guides'

            if git push origin HEAD:main; then
              echo 'Research guides pushed successfully.'
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo '::error::Could not push research guides after 3 attempts.'
              exit 1
            fi

            echo "main advanced during guide push attempt ${attempt}; retrying enrichment from latest main."
            git fetch origin main
            git reset --hard origin/main
            python -u scripts/enrich_paper_radar_summaries_checkpointed.py
          done

      - name: Paper Radar run summary
        if: always()
        env:
          SHOULD_REFRESH: ${{ steps.refresh_check.outputs.should_refresh }}
          SHOULD_ENRICH: ${{ steps.refresh_check.outputs.should_enrich }}
          PENDING_GUIDES: ${{ steps.refresh_check.outputs.pending_guides }}
          EXPECTED_TARGET: ${{ steps.refresh_check.outputs.expected_target }}
        run: |
          {
            echo '## Paper Radar refresh'
            echo
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Expected target: \`${EXPECTED_TARGET:-unknown}\`"
            echo "- Publication refresh required: \`${SHOULD_REFRESH:-unknown}\`"
            echo "- Summary enrichment required: \`${SHOULD_ENRICH:-unknown}\`"
            echo "- Pending/outdated guides before run: \`${PENDING_GUIDES:-unknown}\`"
            if [ -f assets/data/paper-radar.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('assets/data/paper-radar.json').read_text(encoding='utf-8'))
          print(f"- Final targetDate: `{data.get('targetDate')}`")
          papers = data.get('papers') or []
          print(f"- Final paper count: `{len(papers)}`")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

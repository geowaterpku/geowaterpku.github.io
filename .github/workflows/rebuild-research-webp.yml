name: Rebuild research WebP from PNG

on:
  push:
    paths:
      - '.github/workflows/rebuild-research-webp.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --upgrade pillow
      - name: Rebuild WebP files from PNG masters
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          stems = [
              'project-01-spatial-information',
              'project-02-human-alterations',
          ]
          root = Path('assets/research')

          for stem in stems:
              png = root / f'{stem}.png'
              webp = root / f'{stem}.webp'
              with Image.open(png) as image:
                  image.load()
                  image.save(webp, 'WEBP', lossless=True, method=6)
              print(f'{png} -> {webp}')

          html = Path('current-research.html')
          text = html.read_text(encoding='utf-8')
          text = text.replace('assets/research/project-01-spatial-information.jpg?v=3',
                              'assets/research/project-01-spatial-information.webp?v=4')
          text = text.replace('assets/research/project-02-human-alterations.jpg?v=3',
                              'assets/research/project-02-human-alterations.webp?v=4')
          html.write_text(text, encoding='utf-8')

          for stem in stems:
              jpg = root / f'{stem}.jpg'
              if jpg.exists():
                  jpg.unlink()
          PY
      - name: Commit converted images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add current-research.html assets/research/project-01-spatial-information.webp assets/research/project-02-human-alterations.webp
          git add -u assets/research/project-01-spatial-information.jpg assets/research/project-02-human-alterations.jpg
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Rebuild research WebP images from PNG masters'
          git push origin HEAD:main

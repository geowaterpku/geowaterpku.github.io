name: Replace Home 03 with PNG

on:
  push:
    paths:
      - '.home03-png-trigger'

permissions:
  contents: write

jobs:
  replace-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild and verify transport image
        shell: bash
        run: |
          set -euo pipefail
          test -d .home03-png-upload-v2
          cat .home03-png-upload-v2/chunk_* | tr -d '\n' | base64 -d > /tmp/home03-source.webp
          echo "90b67bbe5b5bcbaf8ccb7b0dc58dee407b98112b105a45e3083cefceb44869e2  /tmp/home03-source.webp" | sha256sum -c -
          file /tmp/home03-source.webp | grep -qi 'Web/P image'

      - name: Convert to a valid PNG and update Home 03
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -y -i /tmp/home03-source.webp -compression_level 9 assets/home/geowater-human-background.png
          test "$(xxd -p -l 8 assets/home/geowater-human-background.png)" = "89504e470d0a1a0a"
          file assets/home/geowater-human-background.png | grep -qi 'PNG image data'
          sed -i 's#assets/home/geowater-human-background\.webp#assets/home/geowater-human-background.png#g' home.html
          grep -q 'assets/home/geowater-human-background.png' home.html
          git rm -f assets/home/geowater-human-background.webp || true
          rm -rf .home03-png-upload-v2 .home03-png-upload
          rm -f .home03-png-trigger
          rm -f .github/workflows/replace-home03-hires.yml

      - name: Commit verified PNG replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Home 03 background with valid PNG"
          git push

name: Update Google Scholar metrics

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - people.html
      - .github/workflows/update-scholar.yml

permissions:
  contents: write

concurrency:
  group: scholar-metrics
  cancel-in-progress: true

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Verify SerpApi configuration
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "::error::SERPAPI_KEY is not available to this workflow. Add it under Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          echo "SERPAPI_KEY is available to the workflow."

      - name: Fetch Google Scholar metrics
        env:
          SCHOLAR_AUTHOR_ID: jCA3MkfZkRoC
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          author_id = os.environ['SCHOLAR_AUTHOR_ID']
          serpapi_key = os.environ['SERPAPI_KEY'].strip()
          profile_url = f'https://scholar.google.com/citations?user={author_id}&hl=en'
          output = Path('assets/data/scholar.json')
          output.parent.mkdir(parents=True, exist_ok=True)

          def clean_int(value):
              if value is None:
                  return None
              if isinstance(value, int):
                  return value
              text = str(value).replace(',', '').strip()
              return int(text) if text.isdigit() else None

          response = requests.get(
              'https://serpapi.com/search.json',
              params={
                  'engine': 'google_scholar_author',
                  'author_id': author_id,
                  'hl': 'en',
                  'api_key': serpapi_key,
              },
              timeout=45,
          )

          if response.status_code != 200:
              raise RuntimeError(f'SerpApi HTTP {response.status_code}: {response.text[:500]}')

          payload = response.json()
          if payload.get('error'):
              raise RuntimeError(f"SerpApi error: {payload['error']}")

          metadata = payload.get('search_metadata') or {}
          status = metadata.get('status')
          if status and status != 'Success':
              raise RuntimeError(f'SerpApi search status is {status!r}, expected Success.')

          cited_by = payload.get('cited_by') or {}
          table = cited_by.get('table') or []
          graph = cited_by.get('graph') or []

          metrics = {}
          for row in table:
              if not isinstance(row, dict):
                  continue
              for key in ('citations', 'h_index', 'i10_index'):
                  block = row.get(key)
                  if isinstance(block, dict):
                      metrics[key] = clean_int(block.get('all'))

          citations = metrics.get('citations')
          h_index = metrics.get('h_index')
          i10_index = metrics.get('i10_index')
          if citations is None or h_index is None or i10_index is None:
              available = ', '.join(sorted(metrics)) or 'none'
              raise RuntimeError(
                  f'SerpApi returned incomplete cited_by metrics. Parsed keys: {available}. '
                  f'cited_by keys: {list(cited_by.keys())}'
              )

          history = []
          for point in graph:
              if not isinstance(point, dict):
                  continue
              year = clean_int(point.get('year'))
              value = clean_int(point.get('citations'))
              if year is not None and value is not None:
                  history.append({'year': year, 'citations': value})

          data = {
              'profileUrl': profile_url,
              'authorId': author_id,
              'citations': citations,
              'hIndex': h_index,
              'i10Index': i10_index,
              'history': sorted(history, key=lambda item: item['year'])[-12:],
              'updatedAt': datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z'),
              'source': 'serpapi',
          }
          output.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(
              f"Updated Scholar metrics: citations={citations}, "
              f"h-index={h_index}, i10-index={i10_index}, history_points={len(history)}"
          )
          PY

      - name: Commit refreshed metrics
        run: |
          git add -- assets/data/scholar.json
          if git diff --cached --quiet; then
            echo 'Scholar metrics are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Google Scholar metrics'
          git push

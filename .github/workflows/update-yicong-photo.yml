name: Update Yicong Liu photo

on:
  push:
    branches:
      - update-yicong-liu-photo
    paths:
      - '.github/workflows/update-yicong-photo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-yicong-liu-photo
      - name: Replace Yicong Liu placeholder with photo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('people.html')
          text = p.read_text(encoding='utf-8')
          old = '<article class="person-row person-row--placeholder"><div class="person-headshot-wrapper person-headshot-placeholder" aria-hidden="true"><span>YL</span></div><div class="person-info-block"><h3>Yicong Liu</h3><p class="role">Undergraduate student (2026/3–)</p></div></article>'
          new = '<article class="person-row"><div class="person-headshot-wrapper"><img src="assets/team/yicong_liu.webp?v=1" alt="Yicong Liu"></div><div class="person-info-block"><h3>Yicong Liu</h3><p class="role">Undergraduate student (2026/3–)</p></div></article>'
          if old not in text:
              raise SystemExit('Yicong Liu placeholder not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit HTML update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- people.html
          git commit -m 'Use Yicong Liu profile photo'
          git push origin HEAD:update-yicong-liu-photo

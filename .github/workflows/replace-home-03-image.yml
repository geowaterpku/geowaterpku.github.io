name: Replace Home 03 Image

on:
  push:
    paths:
      - '.bg3-trigger'

permissions:
  contents: write

jobs:
  replace-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace Home 03 image
        shell: bash
        run: |
          set -euo pipefail
          cat .bg3-upload/chunk_*.txt | tr -d '\n' | base64 -d > assets/home/geowater-human-background.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('home.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/home/geowater-human-background.png'
          new = 'assets/home/geowater-human-background.webp'
          if old not in s and new not in s:
              raise SystemExit('Home 03 image reference not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          rm -f assets/home/geowater-human-background.png
          rm -rf .bg3-upload
          rm -f .bg3-trigger
          rm -f .github/workflows/replace-home-03-image.yml

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Replace Home 03 human-flood image"
          git push

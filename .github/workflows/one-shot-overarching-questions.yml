name: One-shot research framing update

on:
  push:
    paths:
      - '.github/workflows/one-shot-overarching-questions.yml'
      - '.github/scripts/one_shot_research_update.py'

permissions:
  contents: write

jobs:
  update-site-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply site updates
        run: python .github/scripts/one_shot_research_update.py

      - name: Commit changes and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-overarching-questions.yml
          git rm .github/scripts/one_shot_research_update.py
          git add assets/nav.js index.html current-research.html
          git commit -m "refine overarching research questions and open-data navigation"
          git push origin HEAD:main

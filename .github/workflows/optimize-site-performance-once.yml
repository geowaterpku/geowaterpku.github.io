name: One-time site performance optimization

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/optimize-site-performance-once.yml"

permissions:
  contents: write

concurrency:
  group: site-performance-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore smaller pre-existing WebP files
        shell: bash
        run: |
          git checkout 76d49f054fc78a1f11ed9e6a4de8ba05f116ce56 -- \
            assets/contact/building.webp \
            assets/team/jinxuan_guo.webp \
            assets/team/meng_ding.webp \
            assets/team/wenli_fei.webp

      - name: Make optimizer preserve a smaller existing WebP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/optimize_site.py')
          text = path.read_text(encoding='utf-8')
          old = '''                    if forced or new_size <= old_size * 0.85:
                        target.write_bytes(tmp.read_bytes())
                        reference_map[source_rel] = rel(target)
                        changed_files.add(rel(target))
                        print(f"converted {source_rel}: {old_size/1024:.0f} KB -> {new_size/1024:.0f} KB")
'''
          new = '''                    if forced or new_size <= old_size * 0.85:
                        # A matching WebP may already exist and be better than a fresh conversion.
                        # Preserve it when it is smaller; still redirect references to that WebP.
                        if target.exists() and target.stat().st_size <= new_size:
                            reference_map[source_rel] = rel(target)
                            print(
                                f"kept existing {rel(target)}: "
                                f"{target.stat().st_size/1024:.0f} KB <= candidate {new_size/1024:.0f} KB"
                            )
                        else:
                            target.write_bytes(tmp.read_bytes())
                            reference_map[source_rel] = rel(target)
                            changed_files.add(rel(target))
                            print(f"converted {source_rel}: {old_size/1024:.0f} KB -> {new_size/1024:.0f} KB")
'''
          if old not in text:
              raise SystemExit('Expected optimizer block was not found; refusing an unsafe patch.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit regression corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contact/building.webp assets/team/jinxuan_guo.webp assets/team/meng_ding.webp assets/team/wenli_fei.webp scripts/optimize_site.py
          git commit -m "Preserve smaller existing WebP assets"
          git pull --rebase origin main
          git push origin main

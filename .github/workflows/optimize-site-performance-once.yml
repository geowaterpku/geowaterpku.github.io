name: One-time site performance optimization

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/optimize-site-performance-once.yml"

permissions:
  contents: write

concurrency:
  group: site-performance-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Optimize assets and loading behavior
        run: python scripts/optimize_site.py

      - name: Commit optimized site
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No optimization changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize site loading performance"
          git pull --rebase origin main
          git push origin main

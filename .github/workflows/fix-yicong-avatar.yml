name: Fix Yicong avatar binary

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/fix-yicong-avatar.yml'

permissions:
  contents: write

jobs:
  fix-avatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild validated WebP and refresh reference
        shell: bash
        run: |
          printf '%s' '' | base64 -d > assets/team/yicong_liu.webp
          python - <<'PY'
          from pathlib import Path
          img = Path('assets/team/yicong_liu.webp').read_bytes()
          assert img[:4] == b'RIFF' and img[8:12] == b'WEBP', 'invalid WebP binary'
          p = Path('people.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('assets/team/yicong_liu.webp?v=2', 'assets/team/yicong_liu.webp?v=3')
          p.write_text(text, encoding='utf-8')
          print('avatar bytes:', len(img))
          PY
      - name: Commit validated avatar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/team/yicong_liu.webp people.html
          git commit -m 'Replace Yicong Liu avatar with validated WebP'
          git push origin HEAD:main

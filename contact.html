<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | GeoWater Lab</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <div class="page">
        <header class="page-heading">
            <p class="eyebrow">GeoWater Lab @ PKU</p>
            <h1>Contact</h1>
            <p>We welcome inquiries from potential collaborators, students, and visiting scholars.</p>
        </header>

        <div class="contact-dual-column-layout">
            <!-- Left Column: Email + MP4 -->
            <div class="contact-column left-column">
                <div class="contact-method-full">
                    <div class="method-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </div>
                    <div class="method-details">
                        <h3 class="method-title">Email</h3>
                        <div class="email-links">
                            <a href="mailto:peironglinlin@pku.edu.cn" class="email-link">peironglinlin@pku.edu.cn</a>
                            <a href="mailto:peironglinlin@gmail.com" class="email-link">peironglinlin@gmail.com</a>
                        </div>
                    </div>
                </div>
                <div class="card visual-media-card-v2 video-card">
                    <div class="media-label">Peking University</div>
                    <video class="visual-element" autoplay muted loop playsinline>
                        <source src="assets/contact/peking.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>

            <!-- Right Column: Address + JPEG + Map -->
            <div class="contact-column right-column">
                <div class="contact-method-full">
                    <div class="method-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    </div>
                    <div class="method-details">
                        <h3 class="method-title">Address：北京大学遥感楼</h3>
                        <p class="address-text">Remote Sensing Building, Peking University, Beijing, 100084</p>
                    </div>
                </div>
                <div class="card visual-media-card-v2 image-card">
                    <div class="media-label">Remote Sensing Building</div>
                    <img src="assets/contact/building.jpeg" alt="Remote Sensing Building" class="visual-element full-fill">
                </div>
                <div class="card map-card-v2">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3055.772!2d116.3103!3d39.9931!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x35f056b1f0a9c665%3A0x9d509eb59e3d67b9!2sRemote%20Sensing%20Building%2C%20Peking%20University!5e0!3m2!1sen!2scn!4v1700000000000" 
                        width="100%" 
                        height="100%" 
                        style="border:0; filter: grayscale(10%) contrast(105%) opacity(0.95);" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
